<!doctype html>
<html lang="ru" data-theme="sage">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outlndrr Extensions</title>
    <link rel="icon" href="../assets/icons/icon-32.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="popup.js" defer></script>
    <script src="video-upscale.js" defer></script>
  </head>
  <body class="popup">
    <header class="brand">
      <img class="mark" src="../assets/brand/cat.jpg" width="40" height="40" alt="">
      <div>
        <h1>Outlndrr</h1>
        <p class="brand-caption">Extensions</p>
      </div>
      <a class="button settings-button" href="../settings/index.html" target="_blank" rel="noopener" aria-label="Открыть настройки" title="Настройки">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 3h4l.6 2.3 1.9 1.1 2.3-.6 2 3.4-1.7 1.7v2.2l1.7 1.7-2 3.4-2.3-.6-1.9 1.1L14 21h-4l-.6-2.3-1.9-1.1-2.3.6-2-3.4 1.7-1.7v-2.2L3.2 9.2l2-3.4 2.3.6 1.9-1.1Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </a>
    </header>
    <main>
      <section class="panel" aria-label="Прокси">
        <div class="panel-heading" role="status" aria-live="polite" aria-atomic="true">
          <span class="proxy-label">Статус прокси</span>
          <span id="proxy-status" class="status-label" data-tone="pending">Загрузка…</span>
        </div>
      </section>
      <section class="panel upscale" aria-labelledby="upscale-heading">
        <label class="upscale-heading" for="upscale-enabled">
          <span><strong id="upscale-heading">Апскейл видео ×2</strong> <span class="badge" data-tone="warn">Эксперимент</span><small>WebGPU, на текущей вкладке</small></span>
          <input id="upscale-enabled" class="switch" type="checkbox" role="switch" aria-describedby="upscale-state" disabled>
        </label>
        <label class="upscale-field" for="upscale-model">Модель</label>
        <select id="upscale-model" disabled>
          <option value="webgpu-fast">WebGPU Fast — 8 каналов</option>
          <option value="webgpu-quality">WebGPU Quality — 16 каналов</option>
        </select>
        <p id="upscale-state" role="status" aria-live="polite" aria-atomic="true">Проверка текущей вкладки…</p>
      </section>
    </main>
  </body>
</html>
